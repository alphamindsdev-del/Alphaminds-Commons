# Wrangler Configuration for AlphaMinds API Worker

name = "alphaminds"
main = "workers/api/src/index.ts"
account_id = "b132d3d8c8d7709b30c0e702482369a4"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Secrets (Set locally via .dev.vars, in production via wrangler secret put):
# JWT_SESSION_SECRET
# RESEND_API_KEY
# WEB_PUSH_VAPID_PRIVATE
# WEB_PUSH_VAPID_PUBLIC
# ADMIN_ALERT_EMAIL

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "alphaminds-commons"
database_id = "3416d527-f0af-4f91-a4b6-9e0fae5549bf"
preview_database_id = "3416d527-f0af-4f91-a4b6-9e0fae5549bf"

# KV Namespace Bindings
[[kv_namespaces]]
binding = "ALPHAMINDS_SESSIONS"
id = "09f205ab1a0648439e62ef97b0ec0585"
preview_id = "09f205ab1a0648439e62ef97b0ec0585"

[[kv_namespaces]]
binding = "ALPHAMINDS_SUBSCRIPTION_CACHE"
id = "7bda6ec612ac428ea319188cd1356959"
preview_id = "7bda6ec612ac428ea319188cd1356959"

[[kv_namespaces]]
binding = "ALPHAMINDS_DAILY_DELIVERY"
id = "53d7aa9fb8b341a08d05f22673ab05ba"
preview_id = "53d7aa9fb8b341a08d05f22673ab05ba"

[[kv_namespaces]]
binding = "ALPHAMINDS_RATE_LIMITS"
id = "9fc5052df38f4e5abeceb270f1c0ad20"
preview_id = "9fc5052df38f4e5abeceb270f1c0ad20"

[[kv_namespaces]]
binding = "ALPHAMINDS_CONTENT_SCHEDULE_CACHE"
id = "5a7627c9362c4c70bf386cd9d381a3a0"
preview_id = "5a7627c9362c4c70bf386cd9d381a3a0"

[[kv_namespaces]]
binding = "ALPHAMINDS_CHAPTER_CONFIG"
id = "278855df10364c3b96a4ca26b992ca6e"
preview_id = "278855df10364c3b96a4ca26b992ca6e"

# R2 Bucket Bindings
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "alphaminds-media"
preview_bucket_name = "alphaminds-media-preview"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "alphaminds-backups"
preview_bucket_name = "alphaminds-backups-preview"

# Cron Triggers (Free plan: max 5 per account)
# Keeping 5 essential jobs for Phase 1:
[triggers]
crons = [
  "0 5 * * *",   # 1 - Daily content delivery (core feature)
  "30 0 * * *",  # 2 - Streak audit (drives engagement/retention)
  "0 1 * * *",   # 3 - Leaderboard recalculation (gamification)
  "0 0 * * 1",   # 4 - Weekly challenge reset (challenge lifecycle)
  "0 4 * * *",   # 5 - D1 backup export (data safety)
]

# Dropped for now (can re-enable when scope grows):
# "0 2 * * 1"   - Impact score recalculation (nice-to-have metric)
# "0 3 * * 0"   - Weekly summary email (engagement email, can wait)

